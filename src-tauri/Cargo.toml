[package]
name = "unilink-desktop"
version = "0.1.0"
description = "System tray application for Unilink"
authors = ["Unilink"]
edition = "2021"

[lib]
name = "unilink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
open = "5"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
